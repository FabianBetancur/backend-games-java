server.port=9000

#############################
# BD DEFAULT
#############################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#############################
# BD SECONDARY
#############################
spring.datasource.second.url=${DB2_URL}
spring.datasource.second.username=${DB2_USER}
spring.datasource.second.password=${DB2_PASSWORD}

#############################
# JWT env // 15 min 900000 // 3 min 180000 // 5 min 300000 // 1 min 60000
#############################
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.recovery-expiration=${JWT_RECOVERY_EXPIRATION}